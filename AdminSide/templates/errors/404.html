<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 480px;
            width: 100%;
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h1 { font-size: 2.25rem; color: #3b82f6; line-height: 1.2; margin-bottom: 12px; }
        h2 { font-size: 1.25rem; color: #334155; margin-bottom: 15px; }
        p { color: #64748b; line-height: 1.6; margin-bottom: 25px; }
        a {
            display: inline-block;
            background-color: #2563eb;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 500;
            transition: background-color 0.2s;
        }
        a:hover { background-color: #1d4ed8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Page Not Found</h1>
        <h2>We couldn't find that page</h2>
        <p>The page you are looking for doesn't exist, has been moved, or is temporarily unavailable.</p>
        <a href="/">Go Back Home</a>
    </div>
</body>
</html>
