{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - PESO Job Matching System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(2deg); }
        }
        .animate-float { animation: float 6s ease-in-out infinite; }
        .gradient-text {
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 50%, #f59e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-slate-950 min-h-screen flex flex-col justify-between text-white font-sans antialiased relative overflow-x-hidden selection:bg-amber-400 selection:text-slate-900">

    <!-- AMBIENT BACKDROP LIGHTING & GRID -->
    <div class="fixed inset-0 z-0 pointer-events-none overflow-hidden">
        <div class="absolute -top-40 -left-40 w-[30rem] h-[30rem] bg-blue-600/25 rounded-full blur-[130px] animate-pulse"></div>
        <div class="absolute top-1/2 -right-40 w-[35rem] h-[35rem] bg-amber-500/20 rounded-full blur-[150px]"></div>
        <div class="absolute -bottom-40 left-1/3 w-[30rem] h-[30rem] bg-indigo-600/25 rounded-full blur-[130px]"></div>
        
        <!-- Modern Grid Texture -->
        <div class="absolute inset-0 bg-[linear-gradient(to_right,#1e293b_1px,transparent_1px),linear-gradient(to_bottom,#1e293b_1px,transparent_1px)] bg-[size:3rem_3rem] [mask-image:radial-gradient(ellipse_60%_50%_at_50%_50%,#000_70%,transparent_100%)] opacity-30"></div>
    </div>

    <!-- TOP NAVIGATION / BACK LINK -->
    <header class="relative z-10 w-full p-6 sm:p-8 flex items-center justify-between max-w-7xl mx-auto">
        <a href="{% url 'landing_page' %}" class="inline-flex items-center gap-3 text-slate-300 hover:text-amber-400 font-extrabold transition duration-300 group">
            <div class="w-11 h-11 rounded-2xl border border-slate-700/80 group-hover:border-amber-400 group-hover:shadow-[0_0_15px_rgba(251,191,36,0.3)] flex items-center justify-center transition duration-300 bg-slate-900/60 backdrop-blur-md">
                <i class="fa-solid fa-house text-lg group-hover:scale-110 transition-transform"></i>
            </div>
            <span class="text-base sm:text-lg tracking-wide">Back To Home</span>
        </a>
    </header>

    <!-- MAIN SIGN IN CONTAINER -->
    <main class="relative z-10 w-full max-w-xl sm:max-w-2xl mx-auto px-4 py-6 flex-grow flex flex-col justify-center items-center">
        
        <!-- LOGO & HEADING -->
        <div class="text-center mb-8">
            <div class="relative inline-block animate-float">
                <div class="absolute -inset-1 rounded-full bg-gradient-to-r from-amber-400 via-blue-600 to-amber-500 opacity-75 blur transition duration-500 group-hover:opacity-100"></div>
                <div class="relative w-28 h-28 sm:w-32 sm:h-32 rounded-full overflow-hidden border-2 border-white/50 bg-white p-2 shadow-2xl">
                    <img src="{% static 'LandingPage/images/PESO_LOGO.png' %}" alt="PESO Logo" class="w-full h-full object-cover rounded-full">
                </div>
            </div>
            
            <h1 class="text-3xl sm:text-5xl font-black tracking-tight mt-5 gradient-text drop-shadow-sm">
                Welcome Back!
            </h1>
            <p class="text-slate-400 text-sm sm:text-base mt-2 font-medium">
                Access your PESO account & unlock career opportunities
            </p>
        </div>

        <!-- FORM CARD WITH GLASSMORPHISM AND GLOW BORDER -->
        <div class="relative w-full group">
            <!-- Ambient Card Glow -->
            <div class="absolute -inset-0.5 bg-gradient-to-r from-blue-600/30 to-amber-500/30 rounded-3xl blur-lg opacity-75 group-hover:opacity-100 transition duration-500"></div>

            <div class="relative w-full bg-white text-slate-900 rounded-3xl shadow-[0_25px_60px_-15px_rgba(0,0,0,0.7)] p-8 sm:p-12 border border-slate-100">
                
                <form method="POST" action="{% url 'signin' %}" class="space-y-6">
                    {% csrf_token %}

                    <!-- ROLE SELECTION TABS -->
                    <input type="hidden" name="user_role" id="user_role" value="jobseeker">
                    
                    <div class="grid grid-cols-2 gap-2 p-1.5 bg-slate-100/80 rounded-2xl border border-slate-200/80 backdrop-blur-sm">
                        <button type="button" id="tab-jobseeker" onclick="selectRole('jobseeker')" 
                            class="py-3.5 text-sm sm:text-base font-black rounded-xl transition-all duration-300 bg-[#6b705c] text-white shadow-md flex items-center justify-center gap-2">
                            <i class="fa-solid fa-user-tie"></i>
                            <span>Job Seeker</span>
                        </button>
                        <button type="button" id="tab-employer" onclick="selectRole('employer')" 
                            class="py-3.5 text-sm sm:text-base font-black rounded-xl transition-all duration-300 bg-transparent text-slate-600 hover:text-slate-900 flex items-center justify-center gap-2">
                            <i class="fa-solid fa-building"></i>
                            <span>Employer</span>
                        </button>
                    </div>

                    <!-- EMAIL FIELD -->
                    <div>
                        <label for="email" class="block text-sm font-black text-slate-800 mb-2">Email Address</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                                <i class="fa-solid fa-envelope text-lg"></i>
                            </div>
                            <input type="email" id="email" name="email" required placeholder="yourexample@email.com" 
                                class="w-full pl-12 pr-5 py-4 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 text-base focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent focus:bg-white transition duration-200 placeholder-slate-400 font-medium">
                        </div>
                    </div>

                    <!-- PASSWORD FIELD -->
                    <div>
                        <label for="password" class="block text-sm font-black text-slate-800 mb-2">Password</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                                <i class="fa-solid fa-lock text-lg"></i>
                            </div>
                            <input type="password" id="password" name="password" required placeholder="••••••••" 
                                class="w-full pl-12 pr-14 py-4 bg-slate-50 border border-slate-300 rounded-xl text-slate-900 text-base focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent focus:bg-white transition duration-200 placeholder-slate-400 font-medium">
                            <button type="button" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 px-5 flex items-center text-slate-400 hover:text-slate-700 focus:outline-none transition">
                                <i id="toggle-icon" class="fa-solid fa-eye-slash text-xl"></i>
                            </button>
                        </div>
                    </div>

                    <!-- REMEMBER ME & FORGOT PASSWORD -->
                    <div class="flex items-center justify-between text-sm pt-1">
                        <label class="flex items-center space-x-2.5 cursor-pointer font-bold text-slate-700 select-none group/checkbox">
                            <input type="checkbox" name="remember_me" class="w-4 h-4 rounded border-slate-300 text-blue-700 focus:ring-blue-600 cursor-pointer transition">
                            <span class="group-hover/checkbox:text-slate-900">Remember me</span>
                        </label>
                        <a href="#" class="font-extrabold text-blue-700 hover:text-blue-900 hover:underline transition">Forgot Password?</a>
                    </div>

                    <!-- SUBMIT BUTTON -->
                    <button type="submit" class="w-full py-4 px-6 bg-gradient-to-r from-[#004baf] to-blue-700 hover:from-blue-800 hover:to-blue-900 active:scale-[0.99] text-white font-black text-base sm:text-lg rounded-xl shadow-lg hover:shadow-blue-500/25 transition duration-300 flex items-center justify-center gap-3 cursor-pointer group/btn">
                        <span>Sign In to Dashboard</span>
                        <i class="fa-solid fa-arrow-right-long text-base group-hover/btn:translate-x-1 transition-transform"></i>
                    </button>

                    <!-- REGISTER LINK -->
                    <p class="text-center text-sm sm:text-base font-extrabold text-slate-700 pt-2">
                        Don't have an account? 
                        <a href="{% url 'register_selection' %}" class="text-amber-500 hover:text-amber-600 underline font-black ml-1 transition">Register here</a>
                    </p>

                </form>

            </div>
        </div>
    </main>

    <footer class="relative z-10 w-full py-6 text-center text-slate-400 text-xs sm:text-sm font-medium">
        &copy; {% now "Y" %} LGU PESO Carigara, Leyte. All rights reserved.
    </footer>

    <!-- INTERACTION SCRIPT -->
    <script>
        // Role Selector Script
        function selectRole(role) {
            const roleInput = document.getElementById('user_role');
            const jsTab = document.getElementById('tab-jobseeker');
            const empTab = document.getElementById('tab-employer');

            roleInput.value = role;

            if (role === 'jobseeker') {
                jsTab.className = "py-3.5 text-sm sm:text-base font-black rounded-xl transition-all duration-300 bg-[#6b705c] text-white shadow-md flex items-center justify-center gap-2";
                empTab.className = "py-3.5 text-sm sm:text-base font-black rounded-xl transition-all duration-300 bg-transparent text-slate-600 hover:text-slate-900 flex items-center justify-center gap-2";
            } else {
                jsTab.className = "py-3.5 text-sm sm:text-base font-black rounded-xl transition-all duration-300 bg-transparent text-slate-600 hover:text-slate-900 flex items-center justify-center gap-2";
                empTab.className = "py-3.5 text-sm sm:text-base font-black rounded-xl transition-all duration-300 bg-amber-400 text-slate-950 shadow-md flex items-center justify-center gap-2";
            }
        }

        // Password Eye Toggle Script
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggle-icon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            }
        }
    </script>
</body>
</html>
