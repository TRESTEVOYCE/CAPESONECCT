                    <!-- Logo Image Container -->
                    <div class="relative w-11 h-11 sm:w-14 sm:h-14 rounded-full bg-slate-800 p-0.5 border border-slate-700 flex-shrink-0 shadow-lg group-hover:border-amber-400 transition-all duration-300 overflow-hidden">
                        <img src="{% static 'LandingPage/images/PESO_LOGO.png' %}" 
                             alt="PESO Logo" 
                             class="w-full h-full object-cover rounded-full group-hover:scale-105 transition-transform duration-300">
                    </div>

                    <!-- Brand Text -->
                    <div class="flex flex-col">
                        <div class="flex items-center gap-2">
                            <span class="font-black text-base sm:text-2xl tracking-tight text-white group-hover:text-amber-300 transition-colors leading-tight">
                                PESO
                            </span>
                            <span class="hidden sm:inline-block px-2 py-0.5 text-[10px] font-bold tracking-wider uppercase bg-amber-400 bg-opacity-10 text-amber-400 border border-amber-400 border-opacity-20 rounded-full">
                                Official
                            </span>
                        </div>
                        <span class="text-xs sm:text-sm font-semibold text-slate-300 leading-tight">
                            Job Matching System
                        </span>
                        <p class="text-[10px] sm:text-xs text-amber-400 font-bold tracking-wider uppercase mt-0.5 flex items-center gap-1">
                            <i class="fa-solid fa-location-dot text-[9px]"></i> Carigara, Leyte
                        </p>
                    </div>
                </a>
            </div>

            <!-- 2. DESKTOP NAVIGATION LINKS WITH SCROLLSPY -->
            <div class="hidden md:flex items-center space-x-1 lg:space-x-2 bg-slate-900 px-3 py-1.5 rounded-full border border-slate-800 shadow-inner"> 
                <a href="#about" 
                   class="nav-link px-4 py-2 text-sm lg:text-base font-semibold text-slate-300 hover:text-white hover:bg-slate-800 rounded-full transition-all duration-200">

                </a>

                <a href="#features" 
                   class="nav-link px-4 py-2 text-sm lg:text-base font-semibold text-slate-300 hover:text-white hover:bg-slate-800 rounded-full transition-all duration-200">
                   Features
                </a>

                <a href="#programs" 
                   class="nav-link px-4 py-2 text-sm lg:text-base font-semibold text-slate-300 hover:text-white hover:bg-slate-800 rounded-full transition-all duration-200">
                   Programs
                </a>
                
            </div>

            <!-- 3. DESKTOP ACTION BUTTONS -->
            <div class="hidden md:flex items-center space-x-3 lg:space-x-4">
                <a href="{% url 'signin' %}" 
                   class="px-4 lg:px-5 py-2.5 text-sm lg:text-base font-bold text-slate-200 hover:text-white hover:bg-slate-800 rounded-xl transition-all duration-200">
                    Sign In
                </a>
                
                <a href="{% url 'register_selection' %}" 
                   class="inline-flex items-center justify-center px-5 lg:px-6 py-2.5 lg:py-3 text-sm lg:text-base font-black text-slate-950 bg-amber-400 hover:bg-amber-300 rounded-xl shadow-lg transition-all duration-300 border border-amber-300">
                    <span>Register Now</span>
                    <i class="fa-solid fa-arrow-right text-xs ml-2"></i>
                </a>
            </div>

            <!-- 4. MOBILE MENU BUTTON -->
            <button id="mobile-menu-toggle" 
                    type="button" 
                    class="md:hidden p-2.5 rounded-xl text-slate-300 hover:text-white hover:bg-slate-800 focus:outline-none transition-colors" 
                    aria-label="Toggle navigation menu" 
                    aria-expanded="false">
                <div class="w-6 h-6 flex flex-col justify-around transform transition-all duration-300">
                    <span id="line1" class="w-full h-0.5 bg-current rounded-full transition-all duration-300 origin-left"></span>
                    <span id="line2" class="w-full h-0.5 bg-current rounded-full transition-all duration-300"></span>
                    <span id="line3" class="w-full h-0.5 bg-current rounded-full transition-all duration-300 origin-left"></span>
                </div>
            </button>

        </div>
    </div>

    <!-- 5. MOBILE DROPDOWN MENU -->
    <div id="mobile-menu" 
         class="hidden md:hidden bg-slate-950 border-b border-slate-800 px-6 pt-2 pb-6 shadow-2xl">
        
        <div class="space-y-1 py-2">
            <a href="#features" class="mobile-nav-link flex items-center justify-between px-4 py-3 rounded-xl text-base font-semibold text-slate-200 hover:text-amber-400 hover:bg-slate-900 transition-all">
                <span>Features</span>
                <i class="fa-solid fa-chevron-right text-xs text-slate-500"></i>
            </a>
            <a href="#faq" class="mobile-nav-link flex items-center justify-between px-4 py-3 rounded-xl text-base font-semibold text-slate-200 hover:text-amber-400 hover:bg-slate-900 transition-all">
                <span>About PESO</span>
                <i class="fa-solid fa-chevron-right text-xs text-slate-500"></i>
            </a>
            <a href="#programs" class="mobile-nav-link flex items-center justify-between px-4 py-3 rounded-xl text-base font-semibold text-slate-200 hover:text-amber-400 hover:bg-slate-900 transition-all">
                <span>Programs</span>
                <i class="fa-solid fa-chevron-right text-xs text-slate-500"></i>
            </a>
        </div>

        <div class="pt-4 border-t border-slate-800 space-y-3">
            <a href="{% url 'signin' %}" 
               class="w-full block text-center py-3 text-base font-bold text-white bg-slate-900 hover:bg-slate-800 rounded-xl border border-slate-700 transition-colors shadow-sm">
                Sign In
            </a>
            <a href="{% url 'register_selection' %}" 
               class="w-full block text-center py-3 text-base font-black text-slate-950 bg-amber-400 hover:bg-amber-300 rounded-xl shadow-lg transition-all">
                Register Now
            </a>
        </div>
    </div>
</nav>

<!-- NAVBAR SCRIPT -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const toggleBtn = document.getElementById('mobile-menu-toggle');
        const mobileMenu = document.getElementById('mobile-menu');
        const line1 = document.getElementById('line1');
        const line2 = document.getElementById('line2');
        const line3 = document.getElementById('line3');
        const mobileNavLinks = document.querySelectorAll('.mobile-nav-link');
        const sections = document.querySelectorAll('section[id]');
        const desktopNavLinks = document.querySelectorAll('.nav-link');

        // Scrollspy Link Highlighter
        window.addEventListener('scroll', () => {
            let current = '';
            sections.forEach(section => {
                const sectionTop = section.offsetTop - 120;
                const sectionHeight = section.offsetHeight;
                if (window.scrollY >= sectionTop && window.scrollY < sectionTop + sectionHeight) {
                    current = section.getAttribute('id');
                }
            });

            desktopNavLinks.forEach(link => {
                link.classList.remove('bg-amber-400', 'text-slate-950', 'shadow-md');
                link.classList.add('text-slate-300');
                if (link.getAttribute('href') === `#${current}`) {
                    link.classList.add('bg-amber-400', 'text-slate-950', 'shadow-md');
                    link.classList.remove('text-slate-300');
                }
            });
        });

        // Mobile Menu Toggle
        let isMenuOpen = false;

        function toggleMenu() {
            isMenuOpen = !isMenuOpen;
            mobileMenu.classList.toggle('hidden');
            toggleBtn.setAttribute('aria-expanded', isMenuOpen);

            if (isMenuOpen) {
                line1.classList.add('rotate-45', 'translate-x-[2px]', 'translate-y-[2px]');
                line2.classList.add('opacity-0');
                line3.classList.add('-rotate-45', 'translate-x-[2px]', '-translate-y-[2px]');
            } else {
                line1.classList.remove('rotate-45', 'translate-x-[2px]', 'translate-y-[2px]');
                line2.classList.remove('opacity-0');
                line3.classList.remove('-rotate-45', 'translate-x-[2px]', '-translate-y-[2px]');
            }
        }

        if (toggleBtn && mobileMenu) {
            toggleBtn.addEventListener('click', toggleMenu);

            mobileNavLinks.forEach(link => {
                link.addEventListener('click', () => {
                    if (isMenuOpen) toggleMenu();
                });
            });
        }
    });
</script>
