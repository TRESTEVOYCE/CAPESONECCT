<nav class="sticky top-0 z-50 bg-gradient-to-r from-blue-950 via-blue-900 to-indigo-950 text-white border-b border-blue-800/40 shadow-xl">
    <div class="w-full px-4 sm:px-8 lg:px-12">
        <div class="flex justify-between h-20 sm:h-24 items-center">
            
            <!-- LOGO AND BRANDING SECTION -->
            <div class="flex items-center gap-3 sm:gap-4">
                <a href="{% url 'landing_page' %}" class="flex items-center gap-3 sm:gap-4 hover:opacity-90 transition">
                    <div class="w-10 h-10 sm:w-14 sm:h-14 rounded-full bg-white/10 flex items-center justify-center overflow-hidden border-2 border-white/20 flex-shrink-0 shadow-inner">
                        <img src="{% static 'LandingPage/images/PESO_LOGO.png' %}" alt="PESO Logo" class="w-full h-full object-cover">
                    </div>

                    <div>
                        <h1 class="font-black text-white text-base sm:text-2xl leading-none tracking-tight">
                            PESO <br><span class="text-xs sm:text-base font-bold tracking-normal text-slate-200">Job Matching System</span>
                        </h1>
                        <p class="text-[10px] sm:text-xs text-amber-400 font-bold tracking-wider uppercase mt-0.5">Carigara, Leyte</p>
                    </div>
                </a>
            </div>

            <!-- DESKTOP NAVIGATION LINKS -->
            <div class="hidden md:flex items-center space-x-8 lg:space-x-10 text-base lg:text-lg font-bold text-slate-100">
                <a href="#features" class="hover:text-amber-400 transition-colors">Features</a>
                <a href="#how-it-works" class="hover:text-amber-400 transition-colors">How it works</a>
                <a href="#programs" class="hover:text-amber-400 transition-colors">Programs</a>

            <!-- DESKTOP ACTION BUTTONS -->
            <div class="hidden md:flex items-center space-x-4 lg:space-x-6">
                <a href="{% url 'signin' %}" class="px-4 lg:px-5 py-2.5 text-base lg:text-lg font-bold text-white hover:text-amber-400 transition-colors">

                </a>
                <!-- FIXED URL HERE -->
                <a href="{% url 'register_selection' %}" class="px-5 lg:px-7 py-2.5 lg:py-3 text-base lg:text-lg font-black text-slate-950 bg-amber-400 hover:bg-amber-300 rounded-xl shadow-lg transition-all transform hover:-translate-y-0.5 border border-amber-500/40">

                </a>
            </div>

            <!-- MOBILE HAMBURGER MENU BUTTON -->
            <button id="mobile-menu-toggle" type="button" class="md:hidden p-2 rounded-lg text-slate-200 hover:text-amber-400 hover:bg-blue-900/50 focus:outline-none" aria-label="Toggle Navigation">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path id="menu-icon" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>

        </div>
    </div>

    <!-- MOBILE DROPDOWN MENU -->
    <div id="mobile-menu" class="hidden md:hidden bg-blue-950/95 border-b border-blue-800/60 px-4 pt-3 pb-6 space-y-4 shadow-2xl backdrop-blur-md">
        <a href="#features" class="block text-base font-bold text-slate-100 hover:text-amber-400 py-1 transition-colors">Features</a>
        <a href="#how-it-works" class="block text-base font-bold text-slate-100 hover:text-amber-400 py-1 transition-colors">How it works</a>

        <hr class="border-blue-800/60 my-2">
        <div class="flex flex-col space-y-3 pt-1">
            <a href="{% url 'signin' %}" class="w-full text-center py-2.5 text-base font-bold text-white bg-blue-900/60 hover:bg-blue-800/80 rounded-lg border border-blue-700/50 transition-colors">
                Sign in
            </a>

                Register Now
            </a>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const toggleBtn = document.getElementById('mobile-menu-toggle');
        const mobileMenu = document.getElementById('mobile-menu');

        if (toggleBtn && mobileMenu) {
            toggleBtn.addEventListener('click', () => {
                mobileMenu.classList.toggle('hidden');
            });
        }
    });
</script>
