{% load static %}

<!DOCTYPE html>
<html lang="en" class="h-full bg-[#0b0f19]">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Check Your Email | CAPESONECCT</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="min-h-full bg-[#0b0f19] text-white">

    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-32 -left-32 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-blue-500/10 rounded-full blur-3xl"></div>
    </div>


    <main class="relative min-h-screen flex items-center justify-center px-6 py-12">

        <div class="w-full max-w-md text-center">

            <!-- Icon -->
            <div class="flex justify-center mb-6">

                <div class="w-20 h-20 rounded-full
                            bg-amber-500/10
                            border border-amber-500/20
                            flex items-center justify-center">

                    <i class="fa-solid fa-envelope-open-text
                              text-3xl text-amber-400"></i>

                </div>

            </div>


            <h1 class="text-3xl font-bold">
                Check Your Email
            </h1>

            <p class="mt-4 text-gray-400 leading-6">
                If an account exists with the email address you submitted,
                we've sent instructions to reset your password.
            </p>


            <!-- Card -->
            <div class="mt-8 bg-[#111827]/90 backdrop-blur-xl
                        border border-white/10
                        rounded-2xl p-7 shadow-2xl">

                <div class="flex items-start gap-4 text-left">

                    <div class="flex-shrink-0">
                        <i class="fa-solid fa-circle-info
                                  text-amber-400 mt-1"></i>
                    </div>

                    <p class="text-sm text-gray-400 leading-6">
                        Check your inbox and spam folder. The reset link
                        will allow you to create a new password.
                    </p>

                </div>


                <a href="{% url 'signin' %}"
                   class="mt-7 w-full inline-flex items-center
                          justify-center py-3.5 rounded-xl
                          border border-white/10
                          bg-white/5
                          hover:bg-white/10
                          text-gray-200
                          font-medium
                          transition">

                    <i class="fa-solid fa-arrow-left mr-2"></i>

                    Back to Login

                </a>

            </div>


            <p class="text-center text-xs text-gray-600 mt-6">
                CAPESONECCT
            </p>

        </div>

    </main>

</body>
</html>
