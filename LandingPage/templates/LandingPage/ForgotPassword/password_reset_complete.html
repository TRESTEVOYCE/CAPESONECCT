{% load static %}

<!DOCTYPE html>
<html lang="en" class="h-full bg-[#0b0f19]">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Changed | CAPESONECCT</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="min-h-full bg-[#0b0f19] text-white">

    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-32 -left-32 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-blue-500/10 rounded-full blur-3xl"></div>
    </div>


    <main class="relative min-h-screen flex items-center justify-center px-6 py-12">

        <div class="w-full max-w-md text-center">

            <div class="flex justify-center mb-6">

                <div class="w-20 h-20 rounded-full
                            bg-green-500/10
                            border border-green-500/20
                            flex items-center justify-center">

                    <i class="fa-solid fa-circle-check
                              text-3xl text-green-400"></i>

                </div>

            </div>


            <h1 class="text-3xl font-bold">
                Password Changed
            </h1>

            <p class="mt-4 text-gray-400 leading-6">
                Your password has been successfully changed.
                You can now sign in using your new password.
            </p>


            <div class="mt-8 bg-[#111827]/90 backdrop-blur-xl
                        border border-white/10
                        rounded-2xl p-7 shadow-2xl">

                <a href="{% url 'signin' %}"
                   class="w-full inline-flex items-center
                          justify-center py-3.5 rounded-xl
                          bg-amber-400
                          hover:bg-amber-300
                          text-gray-950
                          font-semibold
                          transition">

                    <i class="fa-solid fa-right-to-bracket mr-2"></i>

                    Sign In

                </a>

            </div>


            <p class="text-center text-xs text-gray-600 mt-6">
                CAPESONECCT
            </p>

        </div>

    </main>

</body>
</html>
