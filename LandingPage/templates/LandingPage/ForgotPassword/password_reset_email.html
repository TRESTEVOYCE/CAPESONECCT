<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Reset Your Password</title>
</head>

<body style="margin:0; padding:0; background-color:#0b0f19; font-family:Arial,Helvetica,sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
        <td align="center" style="padding:40px 20px;">

            <table width="100%" cellpadding="0" cellspacing="0" border="0"
                style="
                    max-width:500px;
                    background-color:#111827;
                    border:1px solid #263044;
                    border-radius:16px;
                ">

                <tr>
                    <td style="padding:35px;">

                        <h1 style="
                            margin:0 0 20px;
                            color:#ffffff;
                            font-size:26px;
                            font-weight:700;
                        ">
                            Reset Your Password
                        </h1>

                        <p style="
                            margin:0 0 16px;
                            color:#9ca3af;
                            font-size:15px;
                            line-height:1.7;
                        ">
                            Hello,
                        </p>

                        <p style="
                            margin:0 0 24px;
                            color:#9ca3af;
                            font-size:15px;
                            line-height:1.7;
                        ">
                            We received a request to reset your
                            <strong style="color:#ffffff;">
                                CAPESONECCT
                            </strong>
                            account password.
                        </p>

                        <p style="
                            margin:0 0 24px;
                            color:#9ca3af;
                            font-size:15px;
                            line-height:1.7;
                        ">
                            Click the button below to create a new password.
                        </p>

                        <table cellpadding="0" cellspacing="0" border="0">
                            <tr>
                                <td style="border-radius:10px; background-color:#fbbf24;">

                                    <a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}"
                                        style="
                                            display:inline-block;
                                            padding:14px 24px;
                                            color:#111827;
                                            font-size:15px;
                                            font-weight:700;
                                            text-decoration:none;
                                            border-radius:10px;
                                        ">
                                        Reset My Password
                                    </a>

                                </td>
                            </tr>
                        </table>

                        <p style="
                            margin:30px 0 0;
                            color:#9ca3af;
                            font-size:14px;
                            line-height:1.7;
                        ">
                            If you did not request a password reset,
                            you can safely ignore this email.
                        </p>

                        <p style="
                            margin:30px 0 0;
                            color:#6b7280;
                            font-size:13px;
                        ">
                            CAPESONECCT Team
                        </p>

                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>

</html>
