<div x-show="currentStep === 'all' || currentStep === '3'" class="space-y-5">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-stone-200 pb-3">
        <h2 class="text-xs font-bold text-stone-900 uppercase tracking-wider">III. Educational Background</h2>
        <div class="flex items-center gap-5 text-xs">
            <span class="font-medium text-stone-700">Currently in School?*</span>
            <label class="inline-flex items-center gap-1.5 cursor-pointer">{{ form.school_status_yes }} Yes</label>
            <label class="inline-flex items-center gap-1.5 cursor-pointer">{{ form.school_status_no }} No</label>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="space-y-3 bg-stone-50 p-4 rounded-xl border border-stone-200">
            <label class="block text-xs font-bold text-stone-800 uppercase tracking-wide">Highest Educational Attainment*</label>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 text-xs text-stone-700">
                <label class="inline-flex items-center gap-2 bg-white px-3 py-2 rounded-lg border border-stone-200/80">{{ form.edu_no_formal }} No Formal Education</label>
                <label class="inline-flex items-center gap-2 bg-white px-3 py-2 rounded-lg border border-stone-200/80">{{ form.edu_college_grad }} College Graduate</label>
                <label class="inline-flex items-center gap-2 bg-white px-3 py-2 rounded-lg border border-stone-200/80">{{ form.edu_elem_level }} Elementary Level</label>
                <label class="inline-flex items-center gap-2 bg-white px-3 py-2 rounded-lg border border-stone-200/80">{{ form.edu_elem_grad }} Elementary Graduate</label>
                <label class="inline-flex items-center gap-2 bg-white px-3 py-2 rounded-lg border border-stone-200/80">{{ form.edu_hs_level }} High School Level</label>
                <label class="inline-flex items-center gap-2 bg-white px-3 py-2 rounded-lg border border-stone-200/80">{{ form.edu_hs_grad }} High School Graduate</label>
                <label class="inline-flex items-center gap-2 bg-white px-3 py-2 rounded-lg border border-stone-200/80">{{ form.edu_post_grad }} Post Graduate</label>
                <label class="inline-flex items-center gap-2 bg-white px-3 py-2 rounded-lg border border-stone-200/80">{{ form.edu_college_level }} College Level</label>
                <label class="inline-flex items-center gap-2 bg-white px-3 py-2 rounded-lg border border-stone-200/80 sm:col-span-2">{{ form.edu_tech_voc }} Technical Vocational Graduate</label>
            </div>
        </div>

        <div class="space-y-4">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-stone-700 mb-1.5">School / University*</label>
                    <div class="field-wrap">{{ form.school_university }}</div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-stone-700 mb-1.5">Course / Program*</label>
                    <div class="field-wrap">{{ form.course_program }}</div>
                </div>
            </div>
            
            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label class="block text-xs font-medium text-stone-700">Year Graduated / Last Attended</label>
                    <span class="text-[10px] text-stone-400 font-mono">MM/YYYY or YYYY</span>
                </div>
                <div class="field-wrap">{{ form.year_graduated_attended }}</div>
            </div>

            <div>
                <label class="block text-xs font-medium text-stone-700 mb-1.5">Awards / Honors Received (Optional)</label>
                <div class="space-y-2">
                    <div class="field-wrap">{{ form.award_1 }}</div>
                    <div class="field-wrap">{{ form.award_2 }}</div>
                    <div class="field-wrap">{{ form.award_3 }}</div>
                </div>
            </div>
        </div>
    </div>
</div>
