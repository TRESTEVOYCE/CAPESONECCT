<div x-show="currentStep === 'all' || currentStep === '4'" class="space-y-5">
    <div class="flex items-center justify-between border-b border-stone-200 pb-3">
        <h2 class="text-xs font-bold text-stone-900 uppercase tracking-wider">IV. Training, Vocational, and Other Eligibility</h2>
    </div>

    <div class="space-y-4">
        <!-- Entry 1 -->
        <div class="p-4 rounded-xl border border-stone-200 bg-stone-50 space-y-3">
            <span class="text-xs font-bold text-stone-700 uppercase">Training / Eligibility 1</span>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="sm:col-span-2">
                    <label class="block text-xs font-medium text-stone-700 mb-1.5">Course / Training Title / Eligibility (CES, Civil Service, NC II, etc.)*</label>
                    <input type="text" name="training_title_1" value="{{ form.training_title_1.value|default:'' }}" class="w-full h-10 border border-stone-200 bg-white text-stone-900 rounded-[0.65rem] px-3.5 py-[0.55rem] text-xs focus:ring-2 focus:ring-stone-900 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-stone-700 mb-1.5">Number of Hours</label>
                    <input type="number" name="training_hours_1" value="{{ form.training_hours_1.value|default:'' }}" class="w-full h-10 border border-stone-200 bg-white text-stone-900 rounded-[0.65rem] px-3.5 py-[0.55rem] text-xs focus:ring-2 focus:ring-stone-900 focus:outline-none">
                </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="sm:col-span-2">
                    <label class="block text-xs font-medium text-stone-700 mb-1.5">Conducted / Issued By (Institution / Agency)</label>
                    <input type="text" name="training_institution_1" value="{{ form.training_institution_1.value|default:'' }}" class="w-full h-10 border border-stone-200 bg-white text-stone-900 rounded-[0.65rem] px-3.5 py-[0.55rem] text-xs focus:ring-2 focus:ring-stone-900 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-medium text-stone-700 mb-1.5">Date Completed / Issued</label>
                    <input type="date" name="training_date_1" value="{{ form.training_date_1.value|default:'' }}" class="w-full h-10 border border-stone-200 bg-white text-stone-900 rounded-[0.65rem] px-3.5 py-[0.55rem] text-xs focus:ring-2 focus:ring-stone-900 focus:outline-none">
                </div>
            </div>
        </div>

        <!-- Entry 2 -->
        <div class="p-4 rounded-xl border border-stone-200 bg-stone-50 space-y-3">
            <span class="text-xs font-bold text-stone-700 uppercase">Training / Eligibility 2 (Optional)</span>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="sm:col-span-2">
                    <label class="block text-xs font-medium text-stone-700 mb-1.5">Course / Training Title / Eligibility</label>
                    <input type="text" name="training_title_2" value="{{ form.training_title_2.value|default:'' }}" class="w-full h-10 border border-stone-200 bg-white text-stone-900 rounded-[0.65rem] px-3.5 py-[0.55rem] text-xs focus:ring-2 focus:ring-stone-900 focus:outline-none">

                <div>
                    <label class="block text-xs font-medium text-stone-700 mb-1.5">Number of Hours</label>

                </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="sm:col-span-2">
                    <label class="block text-xs font-medium text-stone-700 mb-1.5">Conducted / Issued By</label>
