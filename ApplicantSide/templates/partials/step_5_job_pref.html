<div x-show="currentStep === 'all' || currentStep === '5'" class="space-y-5">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-stone-200 pb-3">
        <h2 class="text-xs font-bold text-stone-900 uppercase tracking-wider">V. Job Preference</h2>
        <div class="flex items-center gap-5 text-xs">
            <span class="font-medium text-stone-700">Preference Type:</span>
            <label class="inline-flex items-center gap-1.5 cursor-pointer">{{ form.pref_local }} Local</label>
            <label class="inline-flex items-center gap-1.5 cursor-pointer">{{ form.pref_overseas }} Overseas</label>
        </div>
    </div>

    <div class="space-y-4">
        <div class="text-xs font-semibold text-stone-800">Preferred Occupations / Industry</div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label class="block text-[11px] font-medium text-stone-600 mb-1">Preferred Occupation 1</label>
                <div class="field-wrap">{{ form.pref_occupation_1 }}</div>
            </div>
            <div>
                <label class="block text-[11px] font-medium text-stone-600 mb-1">Preferred Occupation 2</label>
                <div class="field-wrap">{{ form.pref_occupation_2 }}</div>
            </div>
            <div>
                <label class="block text-[11px] font-medium text-stone-600 mb-1">Preferred Occupation 3</label>
                <div class="field-wrap">{{ form.pref_occupation_3 }}</div>
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
            <div>
                <label class="block text-xs font-medium text-stone-700 mb-1.5">Preferred Location (Local)</label>
                <div class="field-wrap">{{ form.pref_location_local }}</div>
            </div>
            <div>
                <label class="block text-xs font-medium text-stone-700 mb-1.5">Preferred Location (Overseas)</label>
                <div class="field-wrap">{{ form.pref_location_overseas }}</div>
            </div>
        </div>

        <div class="max-w-xs pt-2">
            <label class="block text-xs font-medium text-stone-700 mb-1.5">Expected Salary (PHP/month)</label>
            <div class="field-wrap">{{ form.pref_salary }}</div>
        </div>
    </div>

</div>
