<div x-data="{
    rows: [
        { company: '', address: '', position: '', dates: '', status: '' },
        { company: '', address: '', position: '', dates: '', status: '' }
    ],
    addRow() {
        this.rows.push({ company: '', address: '', position: '', dates: '', status: '' });
    },
    removeRow(index) {
        if (this.rows.length > 1) {
            this.rows.splice(index, 1);
        }
    }
}" x-show="currentStep === 'all' || currentStep === '6'" class="space-y-4">
    
    <div class="flex items-center justify-between border-b border-stone-200 pb-2">
        <h2 class="text-xs font-bold text-stone-900 uppercase tracking-wider">VII. Work Experience [cite: 10]</h2>
        <button type="button" @click="addRow()" class="inline-flex items-center gap-1 px-2.5 py-1 text-[11px] font-semibold bg-indigo-50 text-indigo-700 hover:bg-indigo-100 rounded-lg transition-colors">
            + Add Experience
        </button>
    </div>

    <div class="overflow-x-auto bg-stone-50 border border-stone-200 rounded-xl p-3">
        <table class="w-full text-left text-[11px] border-collapse min-w-[700px]">
            <thead>
                <tr class="border-b border-stone-200 text-stone-700 font-semibold">
                    <th class="p-1.5">Company [cite: 10]</th>
                    <th class="p-1.5">Address [cite: 10]</th>
                    <th class="p-1.5">Position [cite: 10]</th>
                    <th class="p-1.5">Dates [cite: 10]</th>
                    <th class="p-1.5">Status [cite: 10]</th>
                    <th class="p-1.5 w-10 text-center">Action</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-stone-200/60">
                <template x-for="(row, index) in rows" :key="index">
                    <tr>
                        <td class="p-1.5">
                            <input type="text" :name="`work_company_${index+1}`" x-model="row.company" class="border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs w-full bg-white text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600">
                        </td>
                        <td class="p-1.5">
                            <input type="text" :name="`work_address_${index+1}`" x-model="row.address" class="border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs w-full bg-white text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600">
                        </td>
                        <td class="p-1.5">
                            <input type="text" :name="`work_position_${index+1}`" x-model="row.position" class="border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs w-full bg-white text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600">
                        </td>
                        <td class="p-1.5">
                            <input type="text" :name="`work_dates_${index+1}`" x-model="row.dates" placeholder="MM/YYYY - MM/YYYY" class="border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs w-full bg-white text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600">
                        </td>
                        <td class="p-1.5">
                            <input type="text" :name="`work_status_${index+1}`" x-model="row.status" class="border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs w-full bg-white text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600">
                        </td>
                        <td class="p-1.5 text-center">
                            <button type="button" @click="removeRow(index)" x-show="rows.length > 1" class="text-rose-600 hover:text-rose-800 p-1 text-xs font-bold" title="Remove row">×</button>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>

    <div class="flex justify-between pt-4">
        <button type="button" @click="currentStep = '5'" class="px-4 py-2 text-xs font-semibold bg-stone-100 hover:bg-stone-200 rounded-lg">Back</button>
        <button type="button" @click="currentStep = '7'" class="px-4 py-2 text-xs font-semibold bg-stone-900 text-white hover:bg-stone-800 rounded-lg">Next: Skills</button>
    </div>
</div>
