{% extends 'applicant-base.html' %}
{% block title %}Preferred Jobs - PESO Connect{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-8">
        <h1 class="text-2xl font-bold text-slate-900">Preferred Jobs</h1>
        <p class="text-sm text-slate-500 mt-1">Select target positions you want prioritized in your match feed.</p>
    </div>

    <form method="post" class="bg-white rounded-2xl border border-slate-200 p-6 sm:p-8 shadow-sm space-y-5">
        {% csrf_token %}
        <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1.5">Select Preferred Opportunities</label>
            {{ form.preferred_job }}
        </div>
        <div class="flex justify-end gap-3 pt-6 border-t border-slate-100">
            <button type="submit" class="px-5 py-2.5 rounded-xl bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-700">
                Save Preferences
            </button>
        </div>
    </form>
</div>
{% endblock %}
