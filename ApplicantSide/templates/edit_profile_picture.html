{% extends 'applicant-base.html' %}

{% block content %}
<div class="max-w-xl mx-auto py-10 px-4 space-y-6">
    <div class="flex items-center justify-between border-b border-stone-200 pb-3">
        <h2 class="text-sm font-bold text-stone-900 uppercase tracking-wider">Update Profile Picture</h2>
        <a href="{% url 'personal_info' %}" class="text-xs text-stone-500 hover:text-stone-800">Cancel</a>
    </div>

    <form method="POST" enctype="multipart/form-data" class="space-y-5" x-data="{ picName: '' }">
        {% csrf_token %}
        <div class="space-y-1.5" @change="const f = $event.target.files; picName = f.length ? f[0].name : ''">
            <label class="block text-xs font-medium text-stone-700">Select Image (JPG, PNG up to 3MB)</label>
            <div class="relative flex flex-col items-center justify-center p-8 border-2 border-dashed border-stone-300 rounded-xl bg-white hover:border-stone-400 transition-all group overflow-hidden">
                <div class="flex flex-col items-center text-center space-y-1.5 pointer-events-none" x-show="!picName">
                    <svg class="w-8 h-8 text-stone-400 group-hover:text-stone-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                    <span class="text-xs font-medium text-stone-700">Click to upload photo</span>
                </div>
                <div class="text-xs font-medium text-stone-800" x-show="picName" x-text="picName" x-cloak></div>
                <div class="field-wrap [&>input]:opacity-0 [&>input]:absolute [&>input]:inset-0 [&>input]:w-full [&>input]:h-full [&>input]:cursor-pointer [&>input]:z-20">
                    {{ form.profile_picture }}
                </div>
            </div>
        </div>

        <div class="flex justify-end gap-3 pt-4 border-t border-stone-200">
            <a href="{% url 'personal_info' %}" class="px-4 py-2 text-xs font-semibold bg-stone-100 hover:bg-stone-200 rounded-lg">Back</a>
            <button type="submit" class="px-5 py-2.5 text-xs font-semibold text-white bg-stone-900 rounded-lg hover:bg-stone-800">
                Save Picture
            </button>
        </div>
    </form>
</div>
{% endblock %}
